name: Test basic usage with release-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy files to upload
        run: |
          mkdir -p /tmp/release-assets
          echo "asset content" > /tmp/release-assets/asset-a.txt
          echo "more content" > /tmp/release-assets/asset-b.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/release-assets/*.txt
          release-id: "123456789"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
